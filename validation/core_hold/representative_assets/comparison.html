<h1>不同标的、不同周期：策略与持有</h1><p>每组独立 1000 USDT、单币单槽位、单边手续费 0.1%。每格：收益率 / 最大回撤。绿：收益和回撤同时好于原 Portfolio；红：两者同时变差；黄：有得有失。缺少上市前历史的组不测试。各时间窗口重叠，不能把收益相加。</p>

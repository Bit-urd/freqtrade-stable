---
services:
  freqtrade-fast-test:
    image: freqtradeorg/freqtrade:stable
    container_name: freqtrade-fast-test
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    volumes:
      - "./user_data:/freqtrade/user_data"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command: >
      trade
      --config /freqtrade/user_data/config_fast_test_live.json
      --datadir /freqtrade/user_data/data
      --db-url sqlite:////freqtrade/user_data/tradesv3_fast_test.sqlite
      --logfile /freqtrade/user_data/logs/fast_test.log


  freqtrade:
    image: freqtradeorg/freqtrade:stable
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    container_name: freqtrade
    volumes:
      - "./user_data:/freqtrade/user_data"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Expose api on port 8080 (localhost only)
    # Please read the https://www.freqtrade.io/en/stable/rest-api/ documentation
    # for more information.

    # Default command used when running `docker compose up`
    command: >
      trade
      --logfile /freqtrade/user_data/logs/freqtrade.log
      --db-url sqlite:////freqtrade/user_data/tradesv3.dryrun.sqlite
      --config /freqtrade/user_data/config.json
      --strategy Ma200BtcRegimeWeeklySizedPortfolioStrategy
      --datadir /freqtrade/user_data/data
